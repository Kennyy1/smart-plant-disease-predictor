  <text x="2050" y="575" fill="#143C24" font-family="Arial, sans-serif" font-size="78" font-weight="700">Gate model checks plant vs non-plant</text>
  <text x="2050" y="649" fill="#64776B" font-family="Arial, sans-serif" font-size="46">Only valid plant images move into the crop diagnosis stage.</text>
  <text x="2050" y="929" fill="#143C24" font-family="Arial, sans-serif" font-size="78" font-weight="700">Crop classifier selects cassava or maize</text>
  <text x="2050" y="1003" fill="#64776B" font-family="Arial, sans-serif" font-size="46">Low-confidence or unsupported crops are stopped clearly.</text>
  <text x="2050" y="1283" fill="#143C24" font-family="Arial, sans-serif" font-size="78" font-weight="700">Disease model returns final prediction</text>
  <text x="2050" y="1357" fill="#64776B" font-family="Arial, sans-serif" font-size="46">Results include class label, confidence, and short field advice.</text>
